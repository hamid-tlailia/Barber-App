<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="description" content="مِقص — مساحة عمل عربية فاخرة لإدارة صالون الحلاقة، المواعيد، الزبائن، الفريق والمخزون." />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('miqass-theme-mode-v1') || 'system';
          const dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          const theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch { /* The app applies its default theme after loading. */ }
      })();
    </script>
    <title>مِقص | إدارة الصالونات</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

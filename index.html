<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="description" content="مِقص — مساحة عمل عربية فاخرة لإدارة صالون الحلاقة، المواعيد، الزبائن، الفريق والمخزون." />
    <script>
      (() => {
        try {
          let mode = 'system'; try { mode = JSON.parse(localStorage.getItem('miqass-theme')) || 'system'; } catch { /* default */ }
          const dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          const theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.background = dark ? '#121110' : '#f6f4ef';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#121110' : '#f6f4ef');
        } catch { /* The app applies its default theme after loading. */ }
      })();
    </script>
    <title>مِقص | إدارة الصالونات</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
